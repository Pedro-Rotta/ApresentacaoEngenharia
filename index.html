<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div id="previous" class="previous"></div>
      <div id="current" class="current">0</div>
    </div>
    <div class="buttons">
      <button class="btn btn-operator" id="percent">%</button>
      <button class="btn btn-function" id="backspace">⌫</button>
      <button class="btn btn-function" id="clearAll">C</button>
      <button class="btn btn-operator" id="divide">÷</button>

      <button class="btn btn-number" data-number="7">7</button>
      <button class="btn btn-number" data-number="8">8</button>
      <button class="btn btn-number" data-number="9">9</button>
      <button class="btn btn-operator" id="multiply">×</button>

      <button class="btn btn-number" data-number="4">4</button>
      <button class="btn btn-number" data-number="5">5</button>
      <button class="btn btn-number" data-number="6">6</button>
      <button class="btn btn-operator" id="subtract">−</button>

      <button class="btn btn-number" data-number="1">1</button>
      <button class="btn btn-number" data-number="2">2</button>
      <button class="btn btn-number" data-number="3">3</button>
      <button class="btn btn-equals btn-row2" id="equals">=</button>

      <button class="btn btn-number btn-zero" data-number="0">0</button>
      <button class="btn btn-number" id="decimal">.</button>
    </div>
  </div>

  <script src="js/operations/subtrair.js"></script>
  <script src="js/operations/dividir.js"></script>
  <script src="js/operations/multiplicar.js"></script>
  <script src="js/operations/porcentagem.js"></script>
  <script src="js/utils/limpar.js"></script>
  <script src="js/utils/apagar.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
